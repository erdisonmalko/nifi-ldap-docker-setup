services:
  # OpenLDAP - User Authentication
  openldap:
    image: osixia/openldap:1.5.0
    container_name: nifi-openldap
    environment:
      LDAP_ORGANISATION: "NiFi Organization"
      LDAP_DOMAIN: "nifi.local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_BACKEND: "mdb"
      LDAP_TLS: "false"
      LDAP_REPLICATION: "false"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
      - ./ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: --copy-service
    networks:
      - nifi-network
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=nifi,dc=local", "-D", "cn=admin,dc=nifi,dc=local", "-w", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # phpLDAPadmin - Web UI for LDAP management
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: nifi-phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - nifi-network

  # NiFi Registry - Version control for flows
  nifi-registry:
    image: apache/nifi-registry:1.27.0
    container_name: nifi-registry
    user: root
    ports:
      - "18080:18080"
    environment:
      NIFI_REGISTRY_WEB_HTTP_HOST: '0.0.0.0'
      NIFI_REGISTRY_WEB_HTTP_PORT: '18080'
    volumes:
      - nifi-registry-database:/opt/nifi-registry/nifi-registry-current/database
      - nifi-registry-flow-storage:/opt/nifi-registry/nifi-registry-current/flow_storage
    networks:
      - nifi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/nifi-registry"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nifi-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 5


  # Apache NiFi - Main application
  nifi:
    image: apache/nifi:2.0.0
    container_name: nifi
    ports:
      - "8443:8443"
    environment:
      # Single User Auth (initial setup - will be replaced by LDAP)
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: adminpassword123
      
      # JVM Settings
      NIFI_JVM_HEAP_INIT: 2g
      NIFI_JVM_HEAP_MAX: 4g
      
      # Web Settings
      NIFI_WEB_HTTPS_HOST: '0.0.0.0'
      NIFI_WEB_HTTPS_PORT: '8443'
    volumes:
      # Persistent data
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-database:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-logs:/opt/nifi/nifi-current/logs
      
      # Custom locations (not overwriting NiFi directories)
      - ./drivers:/opt/custom/drivers:ro
      - ./output:/opt/custom/output
      - ./scripts:/opt/custom/scripts:ro
      - ./templates:/opt/custom/templates:ro
    depends_on:
      openldap:
        condition: service_healthy
      nifi-registry:
        condition: service_healthy
    networks:
      - nifi-network
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/nifi/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  openldap-data:
  openldap-config:
  nifi-registry-database:
  nifi-registry-flow-storage:
  nifi-conf:
  nifi-database:
  nifi-flowfile:
  nifi-content:
  nifi-provenance:
  nifi-state:
  nifi-logs:
  kafka-data:

networks:
  nifi-network:
    driver: bridge